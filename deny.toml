# cargo-deny — the machine-enforced compliance layer for flashDK.
#
# Goal: make the project legally and operationally defensible by construction
# (license-clean, supply-chain-clean, clean-room). Every check below runs in CI on
# every push and PR; a violation fails the build.

[graph]
all-features = true

# --- Licenses: permissive only, so the Apache-2.0 SDK stays embeddable in
# proprietary clients. A GPL/LGPL/AGPL dependency fails the build. ---
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]

# --- Security advisories (RustSec): fail on known vulnerabilities and yanked crates. ---
[advisories]
version = 2
yanked = "deny"
# Ignore specific advisories only with a written justification. Vulnerabilities are
# never ignored here; entries below are non-vulnerability (unmaintained) notices in
# transitive deps we don't control and that have no safe upgrade available.
ignore = [
    # fxhash: unmaintained (not vulnerable), pulled via str0m -> sctp-proto. No safe
    # upgrade exists upstream. Revisit if/when str0m migrates off it.
    "RUSTSEC-2025-0057",
]

# --- Dependency bans: no wildcard version requirements (supply-chain hygiene).
# Our own workspace path deps are exempt via allow-wildcard-paths. ---
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# --- Sources: dependencies may come only from crates.io. No arbitrary git deps,
# which is where a clean-room violation or supply-chain risk would sneak in. ---
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
