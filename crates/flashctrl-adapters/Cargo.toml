[package]
name = "flashctrl-adapters"
description = "Per-vendor adapters implementing flashctrl-core traits. Clean-room, Apache-2.0."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flashctrl-core = { path = "../flashctrl-core" }
# HTTP client for REST-based devices (PiKVM, NanoKVM). All permissively licensed.
# `json` pulls serde support; default TLS (native-tls) is fine on desktop — we'll
# switch to rustls for mobile cross-compiles later, and add TOFU cert pinning then.
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Only the runnable examples need an async runtime entrypoint; the library itself
# stays runtime-agnostic (the app supplies the executor).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
