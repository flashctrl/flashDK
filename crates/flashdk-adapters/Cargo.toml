[package]
name = "flashdk-adapters"
description = "Per-vendor adapters implementing flashdk-core traits. Clean-room, Apache-2.0."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flashdk-core = { path = "../flashdk-core", version = "0.0.1" }
# HTTP client for REST-based devices (PiKVM, NanoKVM). All permissively licensed.
# `json` pulls serde support; default TLS (native-tls) is fine on desktop — we'll
# switch to rustls for mobile cross-compiles later, and add TOFU cert pinning then.
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NanoKVM: WebSocket transport for its binary HID protocol, plus the RustCrypto
# pieces to replicate its CryptoJS-compatible AES login (all permissive-licensed).
tokio-tungstenite = "0.24"
futures-util = "0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
tokio = { version = "1", features = ["sync", "net"] }

[dev-dependencies]
# Only the runnable examples need an async runtime entrypoint; the library itself
# stays runtime-agnostic (the app supplies the executor).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
