[package]
name = "flashdk-adapters"
description = "Per-vendor adapters implementing flashdk-core traits. Clean-room, Apache-2.0."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flashdk-core = { path = "../flashdk-core", version = "0.0.1" }
# HTTP client for REST-based devices (PiKVM, NanoKVM, JetKVM signaling). All
# permissively licensed. `default-features = false` drops native-tls/OpenSSL
# entirely. NanoKVM/JetKVM only ever speak plain http://, and PiKVM's HTTPS goes
# through our own rustls config (see tls_pin.rs) for TOFU cert pinning, so a single
# rustls stack is all this crate needs (simpler license/audit surface, and no
# OpenSSL to cross-compile for mobile later).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "rustls-tls-manual-roots-no-provider",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TLS for PiKVM's TOFU certificate pinning (tls_pin.rs). aws_lc_rs is the crypto
# provider, not ring, to keep the dependency tree consistent with the WebRTC choice
# below (ring's non-standard license complicates the compliance gate). aws-lc-sys's
# license is a compound OR/AND of Apache-2.0/ISC/MIT/BSD-3-Clause, all on our allow
# list (deny.toml).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
sha2 = "0.10"

# NanoKVM: WebSocket transport for its binary HID protocol, plus the RustCrypto
# pieces to replicate its CryptoJS-compatible AES login (all permissive-licensed).
tokio-tungstenite = "0.24"
futures-util = "0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
tokio = { version = "1", features = ["sync", "net", "rt", "macros", "time"] }

# JetKVM: sans-IO WebRTC (MIT) for its DataChannel HID transport. We drive the UDP
# socket + timers ourselves; no ring/copyleft in the tree.
str0m = "0.6"

[dev-dependencies]
# Only the runnable examples need an async runtime entrypoint; the library itself
# stays runtime-agnostic (the app supplies the executor).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
