name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Type-check
        run: cargo check --all-targets

  licenses:
    name: clean-room license gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails the build if any dependency carries a license not on the permissive
      # allow-list in deny.toml — the machine-enforced half of CLEANROOM.md. A GPL or
      # LGPL crate sneaking into the tree stops the merge here.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
