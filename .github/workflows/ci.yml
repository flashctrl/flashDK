name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, lint & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Deliberately not pinned to a commit: this action's whole purpose is to track
      # whatever Rust currently calls "stable," and pinning it would defeat that. See
      # docs/decisions.md for the reasoning; this is a named exception, not an
      # oversight.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Type-check
        run: cargo check --all-targets
      - name: Docs build clean
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  compliance:
    name: license, supply-chain & clean-room
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Licenses, security advisories, dependency bans, and source integrity: the
      # machine-enforced half of CLEANROOM.md. A copyleft or unknown-source
      # dependency fails the build.
      - name: cargo-deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources

      # Clean-room methodology: every vendor adapter must ship a provenance
      # attestation. No provenance, no merge.
      - name: Clean-room provenance present for every adapter
        shell: bash
        run: |
          fail=0
          for d in crates/flashdk-adapters/src/*/; do
            if [ ! -f "${d}PROVENANCE.md" ]; then
              echo "::error::Missing PROVENANCE.md in ${d}, required by CLEANROOM.md"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "All adapters carry PROVENANCE.md."
          exit $fail

      # Trademark hygiene: vendor marks may be used nominatively in prose, never in
      # package identity or branding. Keeps this project clear of trademark claims.
      - name: No vendor trademark in package identity
        shell: bash
        run: |
          if grep -rniE '^\s*name\s*=\s*".*(pikvm|nanokvm|jetkvm|sipeed|gl-?inet)' --include=Cargo.toml .; then
            echo "::error::Vendor trademark found in a package name, keep marks nominative, not in identity"
            exit 1
          fi
          echo "Package identity is trademark-clean."
